<title>CineSense</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="CineSense – AI-Powered Semantic Movie and Film Discovery System (frontend demo)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: fixed top nav → cinematic hero → horizontally scrolling title rows; overlays for preview, details, player, Mood AI */
:root{
  --bg:#141414; --bg2:#181818; --panel:#232323; --panel2:#2f2f2f; --line:#404040;
  --fg:#e5e5e5; --fg-hi:#ffffff; --fg-dim:#a3a3a3; --fg-mute:#777;
  --red:#e50914; --red-dk:#b20710; --green:#46d369; --gold:#f5c518;
  --display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gl:max(16px, 4vw, env(safe-area-inset-left, 0px));
  --gr:max(16px, 4vw, env(safe-area-inset-right, 0px));
  --per:6; --gap:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg-hi);outline-offset:2px}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.fill{fill:currentColor;stroke:none}

/* ---------- Profile gate ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px var(--gr) 24px var(--gl);text-align:center}
#gate .logo{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:var(--gl)}
#gate h1{font-weight:500;font-size:clamp(28px,5vw,52px);color:var(--fg-hi);margin:0;text-wrap:balance}
.profiles{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,2.4vw,28px)}
.profile{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--fg-dim);width:clamp(88px,11vw,150px)}
.profile .av{width:100%;aspect-ratio:1;border-radius:6px;border:3px solid transparent;transition:border-color .2s}
.profile:hover,.profile:focus-visible{color:var(--fg-hi);outline:none}
.profile:hover .av,.profile:focus-visible .av{border-color:var(--fg-hi)}
.btn-ghost{border:1px solid var(--fg-mute);color:var(--fg-dim);padding:8px 22px;letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.btn-ghost:hover{color:var(--fg-hi);border-color:var(--fg-hi)}
.av{display:grid;place-items:center;position:relative;overflow:hidden}
.av .face{width:56%;height:40%;position:relative}
.av .face::before,.av .face::after{content:"";position:absolute;top:0;width:16%;aspect-ratio:1;background:#fff;border-radius:50%}
.av .face::before{left:14%}.av .face::after{right:14%}
.av .smile{position:absolute;left:18%;right:18%;bottom:0;height:46%;border:3px solid #fff;border-top:0;border-radius:0 0 999px 999px}

/* ---------- Logo ---------- */
.logo{font-family:var(--display);color:var(--red);font-size:34px;letter-spacing:.04em;line-height:1;display:inline-flex;align-items:baseline;gap:1px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.logo i{font-style:normal;font-size:.5em;color:var(--fg-hi);background:var(--red);padding:1px 4px 0;border-radius:2px;margin-left:5px;letter-spacing:.06em;transform:translateY(-.55em)}

/* ---------- Nav ---------- */
#nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:background .35s;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,0))}
#nav.solid{background:var(--bg)}
.nav-in{height:68px;display:flex;align-items:center;gap:clamp(12px,2.2vw,36px);padding-left:var(--gl);padding-right:var(--gr)}
.nav-links{display:flex;gap:20px;list-style:none;margin:0;padding:0}
.nav-links button{font-size:14px;color:var(--fg);transition:color .2s;white-space:nowrap}
.nav-links button:hover{color:var(--fg-dim)}
.nav-links button.on{color:var(--fg-hi);font-weight:700}
.browse{display:none;font-size:14px;font-weight:500;align-items:center;gap:4px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:clamp(10px,1.6vw,22px)}
.search{display:flex;align-items:center;border:1px solid transparent;transition:all .3s;height:36px}
.search.open{border-color:var(--fg-hi);background:rgba(0,0,0,.75)}
.search button{padding:0 6px}
.search input{width:0;background:none;border:0;outline:none;transition:width .3s;font-size:14px;padding:0}
.search.open input{width:clamp(130px,20vw,260px);padding-right:6px}
.search .clear{display:none}.search.has .clear{display:block}
.kids{font-size:14px}
.drop{position:relative}
.bell .dot{position:absolute;top:-4px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.menu{position:absolute;right:0;top:calc(100% + 18px);background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.15);border-top:2px solid var(--fg-hi);width:min(380px,92vw);max-height:70vh;overflow:auto;font-size:13px}
.menu::before{content:"";position:absolute;top:-9px;right:12px;border:7px solid transparent;border-bottom-color:var(--fg-hi);border-top:0}
.notif{display:grid;grid-template-columns:112px 1fr;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;width:100%;align-items:center}
.notif:hover{background:rgba(255,255,255,.06)}
.notif img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:3px}
.notif b{display:block;color:var(--fg-hi);font-weight:500}
.notif small{color:var(--fg-mute)}
.menu .empty{padding:24px;color:var(--fg-dim);text-align:center}
.pmenu{width:220px}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;text-align:left}
.pmenu button:hover span{text-decoration:underline}
.pmenu .av{width:32px;height:32px;border-radius:4px}
.pmenu .av .smile{border-width:2px}
.pmenu hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:6px 0}
.pmenu .signout{justify-content:center;padding:12px}
.me{display:flex;align-items:center;gap:6px}
.me .av{width:32px;height:32px;border-radius:4px}
.me .av .smile{border-width:2px}
.caret{width:14px;height:14px;transition:transform .25s}
.me[aria-expanded="true"] .caret{transform:rotate(180deg)}
.mmenu{left:0;right:auto;width:240px;text-align:center}
.mmenu::before{left:50%;right:auto}
.mmenu button{display:block;width:100%;padding:12px;color:var(--fg-dim)}
.mmenu button.on{color:var(--fg-hi);font-weight:700}

/* ---------- Hero ---------- */
.hero{position:relative;height:clamp(460px,56.25vw,860px);overflow:hidden;background:#000}
.hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 22s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(77deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.25) 52%,transparent 80%),linear-gradient(0deg,var(--bg) 0%,rgba(20,20,20,0) 26%)}
.hero-copy{position:absolute;z-index:2;left:var(--gl);bottom:30%;width:min(40%,560px);display:flex;flex-direction:column;gap:16px;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;align-items:center;gap:8px;font-family:var(--display);letter-spacing:.22em;color:var(--fg-dim);font-size:15px}
.kicker b{color:var(--red);font-size:24px;letter-spacing:0;font-weight:400}
.hero-title{font-family:var(--display);font-weight:400;color:var(--fg-hi);font-size:clamp(44px,7.4vw,120px);line-height:.88;margin:0;letter-spacing:.01em;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.top-badge{display:flex;align-items:center;gap:10px;font-weight:700;font-size:clamp(14px,1.5vw,20px);color:var(--fg-hi)}
.t10{width:28px;height:28px;background:var(--red);border-radius:3px;display:grid;place-items:center;font-family:var(--display);font-size:11px;line-height:.9;text-align:center;padding-top:2px}
.hero-desc{margin:0;font-size:clamp(14px,1.3vw,19px);color:var(--fg-hi);text-shadow:0 2px 8px rgba(0,0,0,.6);text-wrap:pretty}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:4px;padding:10px 26px 10px 20px;font-weight:700;font-size:clamp(14px,1.25vw,18px);transition:opacity .2s,background .2s}
.btn .ico{width:26px;height:26px}
.btn-play{background:var(--fg-hi);color:#000}.btn-play:hover{background:rgba(255,255,255,.75)}
.btn-info{background:rgba(109,109,110,.7);color:var(--fg-hi)}.btn-info:hover{background:rgba(109,109,110,.45)}
.hero-side{position:absolute;z-index:2;right:0;bottom:35%;display:flex;align-items:center;gap:12px}
.round{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center;color:var(--fg-hi);background:rgba(0,0,0,.2)}
.round:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.round .ico{width:20px;height:20px}
.maturity{background:rgba(51,51,51,.6);border-left:3px solid #dcdcdc;padding:6px 60px 6px 12px;font-size:15px;color:var(--fg-hi)}
.hero-dots{position:absolute;z-index:2;right:var(--gr);bottom:20%;display:flex;gap:6px}
.hero-dots button{width:16px;height:3px;background:rgba(255,255,255,.35)}
.hero-dots button.on{background:var(--fg-hi)}

/* ---------- Rows ---------- */
#main{min-height:100vh}
.rows{position:relative;z-index:3;margin-top:-9vw;padding-bottom:40px;display:flex;flex-direction:column;gap:clamp(22px,3vw,44px)}
.rows.flat{margin-top:0;padding-top:100px}
.row h2{margin:0 0 10px;padding-left:var(--gl);padding-right:var(--gr);font-size:clamp(16px,1.5vw,22px);font-weight:700;color:var(--fg-hi);display:flex;align-items:baseline;gap:10px}
.row h2 .explore{font-size:13px;color:#54b9c5;font-weight:500;opacity:0;transition:opacity .3s}
.row:hover h2 .explore{opacity:1}
.track-wrap{position:relative;overflow:hidden}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - (var(--per) - 1) * var(--gap)) / var(--per));gap:var(--gap);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gl);padding:6px var(--gr) 6px var(--gl);scrollbar-width:none;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.track>*{scroll-snap-align:start}
.arrow{position:absolute;top:6px;bottom:6px;width:var(--gl);min-width:16px;z-index:4;background:rgba(20,20,20,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.arrow .ico{width:32px;height:32px;transition:transform .2s}
.arrow:hover .ico{transform:scale(1.3)}
.arrow.l{left:0}.arrow.r{right:0}
.row:hover .arrow{opacity:1}
@media (hover:none){.arrow{display:none}}

.card{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--panel);text-align:left}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.card:hover img{transform:scale(1.04)}
.card-title{position:absolute;left:10px;right:10px;bottom:8px;font-family:var(--display);font-size:clamp(17px,1.6vw,26px);line-height:.95;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);letter-spacing:.02em}
.card::after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);pointer-events:none}
.card-title{z-index:1}
.badge{position:absolute;z-index:1;top:0;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 6px;border-radius:0 0 3px 3px;text-transform:uppercase;white-space:nowrap}
.cmark{position:absolute;z-index:1;top:6px;left:8px;font-family:var(--display);color:var(--red);font-size:20px;line-height:1}
.prog{position:absolute;z-index:2;left:10px;right:10px;bottom:6px;height:3px;background:rgba(255,255,255,.3)}
.prog i{display:block;height:100%;background:var(--red)}
.card.cont .card-title{bottom:16px}
.tall{aspect-ratio:2/3}
.track.tall-track{--per:6}
.track.top-track{--per:5}
.topcard{display:grid;grid-template-columns:48% 52%;align-items:end;aspect-ratio:1.45/1;position:relative}
.topcard .num{font-family:var(--display);font-size:clamp(90px,13vw,230px);line-height:.75;color:var(--bg);-webkit-text-stroke:3px #595959;text-align:right;letter-spacing:-.06em;margin-right:-.04em;align-self:end;transform:translateY(.07em)}
.topcard .card{aspect-ratio:2/3;height:100%;width:auto}

.moods .track{--per:6}
.mood-tile{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;text-align:left;color:#fff;isolation:isolate;transition:transform .25s}
.mood-tile:hover{transform:translateY(-3px)}
.mood-tile b{font-family:var(--display);font-size:clamp(22px,2.2vw,34px);font-weight:400;line-height:1;letter-spacing:.02em}
.mood-tile small{opacity:.8;font-size:12px}
.mood-tile::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.28),transparent 45%)}

/* ---------- Grid pages ---------- */
.page-head{padding:100px var(--gr) 0 var(--gl);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:clamp(26px,3vw,40px);color:var(--fg-hi);font-weight:700}
.page-head select{background:#000;border:1px solid var(--fg-hi);padding:6px 10px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,44%),1fr));gap:28px 8px;padding:24px var(--gr) 60px var(--gl)}
.empty-state{padding:60px var(--gr) 80px var(--gl);color:var(--fg-dim);max-width:640px}
.empty-state h2{color:var(--fg-hi);margin:0 0 8px}
.understood{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px var(--gr) 0 var(--gl);color:var(--fg-dim);font-size:14px}
.chip{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--fg-hi);background:rgba(255,255,255,.04);white-space:nowrap}
button.chip:hover{background:rgba(255,255,255,.14);border-color:#fff}
.chip.on{background:var(--red);border-color:var(--red)}

/* coming soon */
.soon-list{display:flex;flex-direction:column;gap:28px;padding:20px var(--gr) 10px var(--gl)}
.soon{display:grid;grid-template-columns:90px minmax(0,1fr);gap:16px}
.soon .date{font-family:var(--display);color:var(--fg-dim);line-height:.9;text-align:center}
.soon .date b{display:block;font-size:44px;color:var(--fg-hi);font-weight:400}
.soon-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.soon-body .card{cursor:pointer}
.soon-body h3{font-family:var(--display);font-weight:400;font-size:34px;line-height:.95;margin:0 0 6px;color:var(--fg-hi)}
.soon-body p{margin:0 0 12px;color:var(--fg-dim)}
.soon-acts{display:flex;gap:20px;margin-bottom:12px}
.mini-act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--fg-dim)}
.mini-act:hover{color:var(--fg-hi)}
.mini-act[aria-pressed="true"]{color:var(--fg-hi)}

/* ---------- Hover preview ---------- */
#preview{position:fixed;z-index:40;background:var(--bg2);border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.75);transform-origin:center;animation:pop .22s ease both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
#preview .pv-art{position:relative;aspect-ratio:16/9;cursor:pointer}
#preview .pv-art img{width:100%;height:100%;object-fit:cover}
#preview .pv-art .card-title{font-size:26px}
.pv-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.acts{display:flex;align-items:center;gap:8px}
.acts .sp{flex:1}
.cbtn{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;background:rgba(42,42,42,.6);color:#fff;transition:border-color .2s;position:relative}
.cbtn:hover{border-color:#fff}
.cbtn .ico{width:18px;height:18px}
.cbtn.primary{background:#fff;border-color:#fff;color:#000}
.cbtn.primary:hover{background:rgba(255,255,255,.8)}
.cbtn[aria-pressed="true"]{border-color:#fff}
.cbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#e6e6e6;color:#000;font-size:12px;font-weight:700;padding:5px 9px;border-radius:3px;white-space:nowrap;pointer-events:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--fg-dim)}
.match{color:var(--green);font-weight:700}
.rate{border:1px solid rgba(255,255,255,.4);padding:0 5px;font-size:11px;color:var(--fg)}
.hd{border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:0 4px;font-size:10px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px 0;font-size:13px;color:var(--fg-hi)}
.tags span+span::before{content:"•";color:var(--fg-mute);margin:0 6px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);overflow-y:auto;padding:max(32px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px));animation:fade .25s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{max-width:880px;margin:0 auto;background:var(--bg2);border-radius:8px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:up .3s ease both}
@keyframes up{from{transform:translateY(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.m-hero{position:relative;aspect-ratio:16/9}
.m-hero img{width:100%;height:100%;object-fit:cover}
.m-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 2%,transparent 55%)}
.m-hero .x{position:absolute;z-index:2;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}
.m-hero-copy{position:absolute;z-index:2;left:clamp(16px,5%,48px);right:16px;bottom:9%;display:flex;flex-direction:column;gap:16px}
.m-hero-copy h2{font-family:var(--display);font-weight:400;font-size:clamp(38px,6.2vw,72px);line-height:.88;margin:0;color:#fff;max-width:70%;text-wrap:balance}
.m-body{padding:4px clamp(16px,5%,48px) 40px;display:flex;flex-direction:column;gap:28px}
.m-cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
.m-cols p{margin:8px 0 0;color:var(--fg-hi);font-size:15px}
.kv{font-size:14px;color:var(--fg-mute);margin:0 0 10px}
.kv span{color:var(--fg-hi)}
.kv button{color:var(--fg-hi)}
.kv button:hover{text-decoration:underline}
.m-body h3{margin:0 0 14px;font-size:22px;color:var(--fg-hi)}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:14px}
.sim-card{background:var(--panel);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
.sim-card .art{position:relative;aspect-ratio:16/9;cursor:pointer}
.sim-card .art img{width:100%;height:100%;object-fit:cover}
.sim-card .art .dur{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.sim-card .bd{padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--fg-dim)}
.sim-card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sim-card h4{margin:0;color:var(--fg-hi);font-size:14px}
.eps{display:flex;flex-direction:column}
.ep{display:grid;grid-template-columns:30px 140px minmax(0,1fr);gap:16px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--line);border-radius:4px;text-align:left;width:100%}
.ep:first-child{background:var(--panel)}
.ep:hover{background:var(--panel)}
.ep .n{font-size:22px;color:var(--fg-dim);text-align:center}

/* =================== GENERATED ARTWORK =================== */
function rng(seed){ let s = seed % 2147483647; if(s<=0) s+=2147483646; return ()=>((s = s*16807 % 2147483647)-1)/2147483646; }
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function mix(h,amt){ const [r,g,b]=hexRgb(h); const t=amt<0?0:255, p=Math.abs(amt); return `rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`; }
function rgba(h,a){ const [r,g,b]=hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

const MOTIF = {
  sun(x,w,h,S,r,a,b){
    const cx=w*(.3+r()*.4), cy=h*.44, R=S*.2;
    let g=x.createRadialGradient(cx,cy,0,cx,cy,R*3.2); g.addColorStop(0,rgba(b,.75)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    x.fillStyle=mix(b,.35); x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();
    for(let L=0;L<3;L++){ const y0=h*(.58+L*.13), amp=S*(.07-L*.015), f=(1.5+r()*2)/w, ph=r()*6;
      x.fillStyle=mix(a,-.25-L*.25); x.beginPath(); x.moveTo(0,h);
      for(let i=0;i<=w;i+=8) x.lineTo(i,y0+Math.sin(i*f*6.28+ph)*amp); x.lineTo(w,h); x.fill(); }
  },
  orbit(x,w,h,S,r,a,b){
    x.fillStyle=mix(a,-.4); x.fillRect(0,0,w,h);
    for(let i=0;i<w*h/2200;i++){ x.fillStyle=`rgba(255,255,255,${.2+r()*.8})`; const s=r()<.08?2:1; x.fillRect(r()*w,r()*h,s,s); }
    const cx=w*(.55+r()*.2), cy=h*(.5+r()*.15), R=S*.32;
    let g=x.createRadialGradient(cx,cy,R*.6,cx,cy,R*2.2); g.addColorStop(0,rgba(b,.35)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    g=x.createRadialGradient(cx-R*.4,cy-R*.4,R*.1,cx,cy,R); g.addColorStop(0,mix(b,.3)); g.addColorStop(.6,b); g.addColorStop(1,mix(a,-.6));
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,R,0,7); x.fill();
    x.save(); x.translate(cx,cy); x.rotate(-.35); x.strokeStyle=rgba('#ffffff',.55); x.lineWidth=S*.012;
    x.beginPath(); x.ellipse(0,0,R*1.7,R*.32,0,0,7); x.stroke(); x.restore();
    x.fillStyle=mix(b,.6); x.beginPath(); x.arc(cx-R*1.8,cy-R*.9,S*.035,0,7); x.fill();
  },
  city(x,w,h,S,r,a,b){
    let g=x.createLinearGradient(0,h*.3,0,h); g.addColorStop(0,rgba(b,0)); g.addColorStop(1,rgba(b,.55)); x.fillStyle=g; x.fillRect(0,0,w,h);
    for(let layer=0;layer<2;layer++){ let px=-10;
      while(px<w){ const bw=S*(.06+r()*.11), bh=h*(.2+r()*.5)*(layer?1:.75);
        x.fillStyle=mix(a,layer?-.6:-.3); x.fillRect(px,h-bh,bw,bh);
        if(layer) for(let wy=h-bh+8;wy<h-6;wy+=10) for(let wx=px+5;wx<px+bw-5;wx+=8){ if(r()<.3){ x.fillStyle=rgba('#ffd27a',.4+r()*.5); x.fillRect(wx,wy,3,4);} }
        px+=bw+(layer?3:-bw*.3); } }
  },
  waves(x,w,h,S,r,a,b){
    const cx=w*(.2+r()*.6); let g=x.createRadialGradient(cx,h*.25,0,cx,h*.25,S*.8); g.addColorStop(0,rgba(b,.6)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    for(let i=0;i<7;i++){ const y0=h*(.42+i*.09), amp=S*.035, f=(1+r()*2)/w, ph=r()*6;
      x.fillStyle=i%2?rgba(b,.18+i*.05):mix(a,-.15-i*.1); x.beginPath(); x.moveTo(0,h);
      for(let k=0;k<=w;k+=6) x.lineTo(k,y0+Math.sin(k*f*6.28+ph)*amp); x.lineTo(w,h); x.fill(); }
  },
  forest(x,w,h,S,r,a,b){
    const mx=w*(.25+r()*.5); x.fillStyle=mix(b,.45); x.beginPath(); x.arc(mx,h*.28,S*.11,0,7); x.fill();
    let g=x.createRadialGradient(mx,h*.28,0,mx,h*.28,S*.6); g.addColorStop(0,rgba(b,.4)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    for(let L=0;L<4;L++){ const base=h*(.55+L*.13); x.fillStyle=mix(a,-.15-L*.22);
      for(let t=-20;t<w+20;t+=S*(.05+r()*.05)){ const th=S*(.18+r()*.2)*(1-L*.1), tw=th*.38;
        x.beginPath(); x.moveTo(t,base-th); x.lineTo(t+tw,base); x.lineTo(t-tw,base); x.fill(); }
      x.fillRect(0,base-1,w,h-base+1); }
  },
  portrait(x,w,h,S,r,a,b){
    const cx=w*(.4+r()*.2), cy=h*.42;
    let g=x.createRadialGradient(cx,cy,0,cx,cy,S*.7); g.addColorStop(0,mix(b,.2)); g.addColorStop(.5,rgba(b,.4)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    x.fillStyle='#07070a'; x.beginPath(); x.ellipse(cx,cy,S*.12,S*.16,0,0,7); x.fill();
    x.beginPath(); x.moveTo(cx-S*.05,cy+S*.12); x.lineTo(cx-S*.06,cy+S*.24);
    x.bezierCurveTo(cx-S*.4,cy+S*.28,cx-S*.46,h*.9,cx-S*.5,h); x.lineTo(cx+S*.5,h);
    x.bezierCurveTo(cx+S*.46,h*.9,cx+S*.4,cy+S*.28,cx+S*.06,cy+S*.24); x.lineTo(cx+S*.05,cy+S*.12); x.fill();
  },
  grid(x,w,h,S,r,a,b){
    const hz=h*.56, cx=w*(.4+r()*.2), R=S*.24;
    let g=x.createLinearGradient(0,hz-R,0,hz); g.addColorStop(0,mix(b,.3)); g.addColorStop(1,b);
    x.save(); x.beginPath(); x.arc(cx,hz,R,Math.PI,0); x.clip(); x.fillStyle=g; x.fillRect(cx-R,hz-R,R*2,R);
    x.fillStyle=mix(a,-.3); for(let i=0;i<6;i++){ x.fillRect(cx-R,hz-R*.45+i*R*.09,R*2,R*.02+i*1.2); } x.restore();
    x.fillStyle=mix(a,-.55); x.fillRect(0,hz,w,h-hz);
    x.strokeStyle=rgba(b,.75); x.lineWidth=1.2;
    for(let i=-14;i<=14;i++){ x.beginPath(); x.moveTo(cx,hz); x.lineTo(cx+i*w*.12,h); x.stroke(); }
    for(let i=1;i<14;i++){ const y=hz+(h-hz)*Math.pow(i/13,2.2); x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke(); }
  },
  rain(x,w,h,S,r,a,b){
    const lx=w*(.6+r()*.25), ly=h*.3;
    let g=x.createRadialGradient(lx,ly,0,lx,ly,S*.55); g.addColorStop(0,rgba(b,.85)); g.addColorStop(.3,rgba(b,.25)); g.addColorStop(1,rgba(b,0)); x.fillStyle=g; x.fillRect(0,0,w,h);
    x.fillStyle='#0b0b0b'; x.fillRect(lx-2,ly,4,h-ly); x.fillRect(lx-14,ly-4,28,6);
    const fx=w*(.25+r()*.15); x.beginPath(); x.ellipse(fx,h*.6,S*.025,S*.03,0,0,7); x.fill();
    x.beginPath(); x.moveTo(fx-S*.06,h*.64); x.lineTo(fx+S*.06,h*.64); x.lineTo(fx+S*.05,h*.86); x.lineTo(fx-S*.05,h*.86); x.fill();
    x.beginPath(); x.ellipse(fx,h*.58,S*.08,S*.02,0,Math.PI,0); x.fill();
    x.strokeStyle='rgba(255,255,255,.18)'; x.lineWidth=1;
    for(let i=0;i<w*h/1500;i++){ const sx=r()*w, sy=r()*h; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx-4,sy+14); x.stroke(); }
    g=x.createLinearGradient(0,h*.86,0,h); g.addColorStop(0,rgba(b,.25)); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,h*.86,w,h*.14);
  }
};

const ART = new Map();
function art(m, kind){
  const key = m.id+kind; if(ART.has(key)) return ART.get(key);
  const [w,h] = kind==='poster'?[340,510]:kind==='hero'?[1600,900]:[640,360];
  const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
  const r=rng(m.id*7919+3); const [a,b]=m.pal;
  const g=x.createLinearGradient(0,0,w*.3,h); g.addColorStop(0,a); g.addColorStop(1,mix(a,-.6)); x.fillStyle=g; x.fillRect(0,0,w,h);
  const S=Math.min(w,h)*(kind==='poster'?1.15:1);
  MOTIF[m.motif](x,w,h,S,r,a,b);
  const v=x.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)'); x.fillStyle=v; x.fillRect(0,0,w,h);
  for(let i=0;i<w*h/350;i++){ x.fillStyle=`rgba(255,255,255,${r()*.045})`; x.fillRect(r()*w,r()*h,1,1); }
  if(kind==='poster'){
    const sh=x.createLinearGradient(0,h*.55,0,h); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.85)'); x.fillStyle=sh; x.fillRect(0,h*.55,w,h*.45);
    x.fillStyle='#e50914'; x.font='34px "Bebas Neue", Impact, sans-serif'; x.textAlign='left'; x.fillText('C',16,44);
    let fs=64; x.font=`${fs}px "Bebas Neue", Impact, sans-serif`;
    const words=m.title.toUpperCase().split(' '); let lines=[], cur='';
    for(const wd of words){ const t=cur?cur+' '+wd:wd; if(x.measureText(t).width>w*.86 && cur){ lines.push(cur); cur=wd; } else cur=t; }
    lines.push(cur);
    while(lines.some(l=>x.measureText(l).width>w*.9) && fs>30){ fs-=4; x.font=`${fs}px "Bebas Neue", Impact, sans-serif`; }
    x.textAlign='center'; x.fillStyle='#fff'; x.shadowColor='rgba(0,0,0,.7)'; x.shadowBlur=14;
    const lh=fs*.92; let y=h-28-(lines.length-1)*lh-22;
    lines.forEach((l,i)=>x.fillText(l,w/2,y+i*lh)); x.shadowBlur=0;
    x.font='600 13px "DM Sans", sans-serif'; x.fillStyle='rgba(255,255,255,.75)';
    x.fillText(m.type==='series'?'NEW SERIES':m.year>=2025?'NEW FILM':'FILM',w/2,h-22);
  }
  const url=c.toDataURL('image/jpeg',.84); ART.set(key,url); return url;
}

/* =================== HELPERS =================== */
const moodLabels = m => m.moods.map(k=>MOODS[k].label);
const genreLabels = m => m.genres.map(k=>GENRE[k]);
const inList = id => state.list.has(+id);
function tagLine(m){ return [...moodLabels(m).slice(0,2), ...genreLabels(m).slice(0,1)]; }
function similarity(a,b){
  const A=new Set([...a.moods.map(x=>'m'+x),...a.genres.map(x=>'g'+x),...a.tags.map(x=>'t'+x)]);
  const B=new Set([...b.moods.map(x=>'m'+x),...b.genres.map(x=>'g'+x),...b.tags.map(x=>'t'+x)]);
  let inter=0; A.forEach(x=>{ if(B.has(x)) inter += x[0]==='m'?1.4:1; });
  return inter/ (new Set([...A,...B]).size) + (a.lang===b.lang?.08:0);
}
function similar(m,n=9){
  return CATALOG.filter(o=>o.id!==m.id).map(o=>({o,s:similarity(m,o)})).sort((x,y)=>y.s-x.s).slice(0,n);
}

    romance:['romance','romcom','rom-com','love story'], drama:['drama'], action:['action','fight','chase','race'],
    animation:['animat','cartoon','anime'], documentary:['documentar','nature','ocean','real life'],

  },

    strongfemale:['female lead','strong female','woman','women','heroine','girl power','she ','her own','sister'],
    family:['family','kids','children','child','all ages'], noir:['noir','classic noir','film noir','hardboiled'],

  type:{series:['series','show','tv','binge','episodes'],movie:['movie','film']}
};
const STOP = new Set('the and for with that this want something some movie movies film films show shows like about watch need give please feel feeling really very more tonight today into from have what your best good'.split(' '));

function interpret(text){
  const t=' '+text.toLowerCase().replace(/[^\w\s'-]/g,' ')+' ';
  const has = s => t.includes(s.startsWith(' ')||s.endsWith(' ')?s:s);
  const negated = s => new RegExp(`\\b(not|no|nothing|don'?t want|avoid|without)\\s+(too\\s+|a\\s+|any\\s+)?${s.trim().replace(/[-]/g,'\\-')}`).test(t);
  const out={moods:new Set(),genres:new Set(),tags:new Set(),avoid:new Set(),langs:new Set(),type:null,feelings:[]};
  for(const [k,syns] of Object.entries(LEX.mood)) for(const s of syns){ if(has(s)){ (negated(s)?out.avoid:out.moods).add(k); break; } }
  for(const [k,helps] of Object.entries(LEX.feeling)) if(t.includes(k)){ out.feelings.push(k); helps.forEach(h=>{ if(!out.avoid.has(h)) out.moods.add(h); }); }
  for(const [k,syns] of Object.entries(LEX.genre)) if(syns.some(has)) out.genres.add(k);
  for(const [k,syns] of Object.entries(LEX.tag)) if(syns.some(has)) out.tags.add(k);
  for(const [k,syns] of Object.entries(LEX.lang)) if(syns.some(has)) out.langs.add(k);
  for(const [k,syns] of Object.entries(LEX.type)) if(syns.some(s=>new RegExp('\\b'+s).test(t))) { out.type=k; if(k==='series') break; }
  out.avoid.forEach(a=>out.moods.delete(a));
  if(out.genres.has('horror')&&!out.avoid.has('scary')) out.moods.add('scary');
  out.words = t.split(/\s+/).filter(w=>w.length>3&&!STOP.has(w));
  return out;
}
function score(m,q){
  let s=0, why=[];
  q.moods.forEach(k=>{ if(m.moods.includes(k)){ s+=3; why.push(MOODS[k].label);} });
  q.genres.forEach(k=>{ if(m.genres.includes(k)){ s+=2.5; why.push(GENRE[k]);} });
  q.tags.forEach(k=>{ if(m.tags.includes(k)){ s+=2.5; why.push(TAGS[k]);} });
  q.avoid.forEach(k=>{ if(m.moods.includes(k)) s-=8; });
  if(q.langs.size){ if(q.langs.has(m.lang)){ s+=4; why.push(m.lang);} else s-=6; }
  if(q.type && m.type!==q.type) s-=1.5;
  const hay=(m.title+' '+m.desc+' '+m.cast.join(' ')).toLowerCase();
  q.words.forEach(w=>{ if(hay.includes(w)) { s+=1; } });
  return {s,why:[...new Set(why)]};
}
function semanticSearch(text,n=24){
  const q=interpret(text);
  const tl=text.toLowerCase().trim();
  return {q, results: CATALOG.map(m=>{ const r=score(m,q); if(m.title.toLowerCase().includes(tl)) r.s+=10; if(m.cast.some(c=>c.toLowerCase().includes(tl))) r.s+=6; return {m,...r}; })
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n)};
}
function understoodChips(q){
  return [...[...q.moods].map(k=>MOODS[k].label),...[...q.genres].map(k=>GENRE[k]),...[...q.tags].map(k=>TAGS[k]),...q.langs,...[...q.avoid].map(k=>'not '+MOODS[k].label)];
}

function showPreview(card){

  pv.hidden=false;
  const ph=pv.offsetHeight; let top=r.top+r.height/2-(w*9/16)/2-10;
  top=Math.max(76,Math.min(top,innerHeight-ph-8)); pv.style.top=top+'px';
  pvCard=card;
}

  if(c && c!==pvCard){ clearTimeout(hoverT); hoverT=setTimeout(()=>showPreview(c),480); }
});
document.addEventListener('mouseout',e=>{
  const c=e.target.closest('[data-hover]');
  if(c && !c.contains(e.relatedTarget) && !(e.relatedTarget && pv.contains(e.relatedTarget))) clearTimeout(hoverT);
});

      <div class="m-cols"><div>${metaHTML(m)}<div class="meta" style="margin-top:6px"><span>${m.year}</span><span>${m.lang}</span>${m.soon?`<span style="color:var(--red);font-weight:700">Arrives ${m.soon.join(' ')}</span>`:''}</div>
        ${TOP10.includes(m.id)?`<div class="top-badge" style="margin-top:12px;font-size:16px"><span class="t10">TOP<br>10</span>#${TOP10.indexOf(m.id)+1} in Movies Today</div>`:''}
        <p>${esc(m.desc)}</p></div>
      <div><p class="kv">Cast: <span>${m.cast.map(esc).join(', ')}</span></p>
        <p class="kv">Genres: <span>${genreLabels(m).join(', ')}</span></p>
        <p class="kv">This title is: ${m.moods.map(k=>`<button data-act="mood" data-mood="${k}">${MOODS[k].label}</button>`).join(', ')}</p></div></div>
      ${eps}
      <section><h3>More Like This</h3><div class="sim">${sims.map(({o,s})=>`<div class="sim-card"><div class="art" data-open="${o.id}"><img src="${art(o,'card')}" alt="" loading="lazy"><span class="cmark">C</span><span class="dur">${o.dur}</span><span class="card-title">${esc(o.title)}</span></div>
        <div class="bd"><div class="row1"><div><span class="match">${Math.min(99,Math.round(55+s*60))}% Match</span><div class="meta"><span class="rate">${o.rating}</span><span>${o.year}</span></div></div>
        <button class="cbtn" data-act="list" data-id="${o.id}" aria-pressed="${inList(o.id)}" data-tip="${inList(o.id)?'Remove from My List':'Add to My List'}" aria-label="My List">${inList(o.id)?I.check:I.plus}</button></div>
        <p style="margin:0">${esc(o.desc)}</p></div></div>`).join('')}</div></section>
      <section class="about"><h3>About ${esc(m.title)}</h3>
        <p>Cast: <span style="color:var(--fg)">${m.cast.map(esc).join(', ')}</span></p>
        <p>Genres: <span style="color:var(--fg)">${genreLabels(m).join(', ')}</span></p>
        <p>Mood profile: <span style="color:var(--fg)">${moodLabels(m).join(', ')}</span>${m.tags.length?` · Themes: <span style="color:var(--fg)">${m.tags.map(t=>TAGS[t]).join(', ')}</span>`:''}</p>
        <p>Maturity rating: <span class="rate">${m.rating}</span></p></section>
    </div></div>`;
  modalWrap.hidden=false; modalWrap.scrollTop=0; document.body.classList.add('lock');
  $('.x',modalWrap).focus({preventScroll:true});
}
function closeModal(){ modalWrap.hidden=true; modalWrap.innerHTML=''; if($('#player').hidden && $('#ai').hidden) document.body.classList.remove('lock'); }
modalWrap.addEventListener('click',e=>{ if(e.target===modalWrap||e.target.closest('[data-close]')) closeModal(); });

/* =================== PLAYER =================== */
const player=$('#player'); let plT=null;
function openPlayer(m){
  hidePreview();
  player.innerHTML=`<img class="bgart" src="${art(m,'hero')}" alt=""><button class="back" data-closeplayer>${I.back} Back to Browse</button>
    <div class="pl-box"><div class="spinner"></div><h2>${esc(m.title)}</h2><p>Loading…</p></div>
    <div class="pl-bar"><span>0:00</span><div class="rail"><i></i></div><span>${esc(m.dur)}</span></div>`;
  player.hidden=false; document.body.classList.add('lock');
  clearTimeout(plT);
  plT=setTimeout(()=>{ $('.pl-box',player).innerHTML=`<svg class="ico" viewBox="0 0 24 24" style="width:56px;height:56px;color:var(--red)"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    <h2>This title can't be played right now</h2>
    <p>Streaming for <b style="color:#fff">${esc(m.title)}</b> isn't available yet. Playback will open once the video service is connected to CineSense.</p>
    <span class="code">ERROR CODE: CS-STREAM-NOT-READY</span>
    <div class="btns" style="justify-content:center;margin-top:6px"><button class="btn btn-play" data-closeplayer>Back to Browse</button><button class="btn btn-info" data-act="download" data-id="${m.id}">${I.dl} Download instead</button></div>`; },1400);
}
function closePlayer(){ clearTimeout(plT); player.hidden=true; player.innerHTML=''; if(modalWrap.hidden && $('#ai').hidden) document.body.classList.remove('lock'); }
player.addEventListener('click',e=>{ if(e.target.closest('[data-closeplayer]')) closePlayer(); });

/* =================== TOASTS & NOTIFICATIONS =================== */
function toast(title,msg='',opts={}){
  const t=document.createElement('div'); t.className='toast'+(opts.ok?' ok':'');
  t.innerHTML=`${opts.icon||I.info}<div><b>${title}</b>${msg?`<span>${msg}</span>`:''}</div>${opts.progress?'<div class="tp"><i></i></div>':''}`;
  $('#toasts').appendChild(t);
  const kill=()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); };
  if(!opts.sticky) setTimeout(kill,opts.time||3200);
  t.kill=kill; return t;
}
function notify(text,id){
  state.notifs.unshift({text,id,time:'Just now'}); state.unread++; renderBell();
}
function renderBell(){
  const dot=$('#bellDot'); dot.hidden=!state.unread; dot.textContent=state.unread;
  $('#bellMenu').innerHTML = state.notifs.length ? state.notifs.map(n=>{ const m=byId(n.id);
    return `<button class="notif" data-open="${n.id}"><img src="${art(m,'card')}" alt=""><span><b>${n.text}</b><small>${n.time}</small></span></button>`; }).join('')
    : `<div class="empty">No notifications yet</div>`;
}
function startDownload(m){
  if(m.soon) return toast('Not released yet',`${esc(m.title)} can be downloaded after it arrives.`);
  if(state.downloads.has(m.id)) return toast('Already downloaded',`${esc(m.title)} is in your Downloads.`,{icon:I.dlDone,ok:true});
  const t=toast(`Downloading ${esc(m.title)}`,'Preparing download…',{icon:I.dl,progress:true,sticky:true});
  let p=0; const bar=$('.tp i',t), sub=$('span',t);
  const iv=setInterval(()=>{ p=Math.min(100,p+7+Math.random()*12); bar.style.width=p+'%'; sub.textContent=`${Math.round(p)}% · ${m.type==='series'?'Episode 1':'HD · '+(0.9+m.id%7/10).toFixed(1)+' GB'}`;
    if(p>=100){ clearInterval(iv); t.kill();
      state.downloads.add(m.id); save(); refreshButtons(m.id);
      toast('Download complete',`${esc(m.title)} is ready to watch offline.`,{icon:I.dlDone,ok:true});
      notify(`Downloaded: ${esc(m.title)} is ready offline`,m.id); } },220);
}

/* =================== ACTIONS =================== */
function refreshButtons(id){
  $$(`[data-act="list"][data-id="${id}"]`).forEach(b=>{ const on=inList(id); b.setAttribute('aria-pressed',on); b.dataset.tip=on?'Remove from My List':'Add to My List'; b.innerHTML=on?I.check:I.plus; });
  $$(`[data-act="like"][data-id="${id}"]`).forEach(b=>{ const on=state.liked.has(+id); b.setAttribute('aria-pressed',on); b.dataset.tip=on?'Rated':'I like this'; b.innerHTML=on?I.liked:I.like; });
  $$(`.cbtn[data-act="download"][data-id="${id}"]`).forEach(b=>{ const on=state.downloads.has(+id); b.dataset.tip=on?'Downloaded':'Download'; b.innerHTML=on?I.dlDone:I.dl; });
}
const SOON_MSG = {
  kids:['Kids profile','Switch to the Kids profile from the profile menu to see family titles.'],
  manage:['Manage Profiles','Profile editing will be available once accounts are connected.'],
  account:['Account','Account settings will open when sign-in is connected.'],
  help:['Help Centre','Help articles will be added in the next version.'],
  soon:['Coming soon','This page is not available in the demo yet.'],
  svc:['Service Code','CS-DEMO-2026']
};
function act(name,el){
  const id=+el.dataset.id, m=id?byId(id):null;
  switch(name){
    case 'play': return openPlayer(m);
    case 'list': {
      if(inList(id)){ state.list.delete(id); toast('Removed from My List',esc(m.title),{icon:I.check}); }
      else { state.list.add(id); toast('Added to My List',esc(m.title),{icon:I.check,ok:true}); }
      save(); refreshButtons(id); if(state.page==='mylist'&&!state.query&&modalWrap.hidden) render(); return; }
    case 'like': {
      if(state.liked.has(id)){ state.liked.delete(id); toast('Rating removed',esc(m.title),{icon:I.like}); }
      else { state.liked.add(id); toast('Thanks for rating!',`We'll recommend more like ${esc(m.title)}.`,{icon:I.liked,ok:true}); }
      save(); return refreshButtons(id); }
    case 'download': return startDownload(m);
    case 'remind': {
      const on=state.reminders.has(id);
      on?state.reminders.delete(id):state.reminders.add(id); save();
      toast(on?'Reminder removed':'Reminder set',on?esc(m.title):`We'll notify you when ${esc(m.title)} arrives on ${m.soon.join(' ')}.`,{icon:on?I.bell:I.bellOn,ok:!on});
      if(!on) notify(`Reminder set: ${esc(m.title)} arrives ${m.soon.join(' ')}`,id);
      if(!modalWrap.hidden) openModal(id);
      if(state.page==='new') render(); return; }
    case 'share': {
      const link=`cinesense.app/title/${id}`;
      try{ navigator.clipboard.writeText(link).then(()=>toast('Link copied',link,{icon:I.share,ok:true}),()=>toast('Share link',link,{icon:I.share})); }catch(e){ toast('Share link',link,{icon:I.share}); }
      return; }
    case 'mood': closeModal(); return openAI(MOODS[el.dataset.mood].label+' movies', el.dataset.mood);
    case 'ai': return openAI(el.dataset.q);
    case 'mute': state.muted=!state.muted; el.innerHTML=state.muted?I.mute:I.sound; return toast(state.muted?'Trailer muted':'Trailer sound on','Trailers will play when streaming is connected.',{icon:state.muted?I.mute:I.sound});
    case 'signout': closeMenus(); state.query=''; $('#q').value=''; return showGate();
    case 'switch': closeMenus(); return chooseProfile(+el.dataset.p);
    default: { const s=SOON_MSG[name]; if(s) toast(s[0],s[1]); }
  }
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(a){ e.preventDefault(); return act(a.dataset.act,a); }
  const sc=e.target.closest('[data-scroll]');
  if(sc){ const tr=sc.parentElement.querySelector('.track'); tr.scrollBy({left:+sc.dataset.scroll*tr.clientWidth*.9}); return; }
  const h=e.target.closest('[data-hero]');
  if(h){ setHero(+h.dataset.hero); startHero(heroList); state.heroIdx=+h.dataset.hero; return; }
  const pg=e.target.closest('[data-page]');
  if(pg){ closeMenus(); state.page=pg.dataset.page; state.query=''; $('#q').value=''; $('#search').classList.remove('has'); render(); scrollTo({top:0}); return; }
  const o=e.target.closest('[data-open]');
  if(o){ closeMenus(); if(!player.hidden) closePlayer(); return openModal(o.dataset.open); }
  if(!e.target.closest('.drop')) closeMenus();
});
document.addEventListener('change',e=>{ if(e.target.id==='langSel'){ state.lang=e.target.value; render(); } });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!player.hidden) return closePlayer();
  if(!modalWrap.hidden) return closeModal();
  if(!$('#ai').hidden) return closeAI();
  closeMenus();
});

/* =================== NAV / MENUS =================== */
addEventListener('scroll',()=>$('#nav').classList.toggle('solid',scrollY>40),{passive:true});
const MENUS=[['#bellBtn','#bellMenu'],['#meBtn','#meMenu'],['#browseBtn','#browseMenu']];
function closeMenus(except){ MENUS.forEach(([b,m])=>{ if(m!==except){ $(m).hidden=true; $(b).setAttribute('aria-expanded','false'); } }); }
MENUS.forEach(([b,m])=>$(b).addEventListener('click',e=>{
  e.stopPropagation(); const open=$(m).hidden; closeMenus(m); $(m).hidden=!open; $(b).setAttribute('aria-expanded',open);
  if(b==='#bellBtn'&&open){ state.unread=0; $('#bellDot').hidden=true; }
}));

const search=$('#search'), q=$('#q'); let qT=null;
$('#searchBtn').addEventListener('click',()=>{ search.classList.add('open'); q.focus(); });
q.addEventListener('blur',()=>{ if(!q.value) search.classList.remove('open'); });
q.addEventListener('input',()=>{
  search.classList.toggle('has',!!q.value); clearTimeout(qT);
  qT=setTimeout(()=>{ state.query=q.value.trim(); render(); if(state.query) scrollTo({top:0}); },220);
});
$('#qClear').addEventListener('click',()=>{ q.value=''; state.query=''; search.classList.remove('has'); render(); q.focus(); });

/* =================== PROFILES =================== */
function avHTML(p){ return `<span class="face"></span><span class="smile"></span>`; }
function setAv(el,p){ el.style.background=p.color; el.innerHTML=avHTML(p); }
function showGate(){
  $('#profiles').innerHTML=PROFILES.map((p,i)=>`<button class="profile" data-pick="${i}"><span class="av" style="background:${p.color}">${avHTML(p)}</span><span>${p.name}</span></button>`).join('');
  $('#gate').hidden=false; document.body.classList.add('lock');
}
$('#profiles').addEventListener('click',e=>{ const b=e.target.closest('[data-pick]'); if(b) chooseProfile(+b.dataset.pick); });
function chooseProfile(i){
  state.profile=PROFILES[i]; state.page='home';
  setAv($('#meAv'),state.profile);
  $('#meMenu').innerHTML = PROFILES.map((p,j)=>j===i?'':`<button data-act="switch" data-p="${j}"><span class="av" style="background:${p.color}">${avHTML(p)}</span><span>${p.name}</span></button>`).join('')
    + `<button data-act="manage"><span>Manage Profiles</span></button><hr><button data-act="account"><span>Account</span></button><button data-act="help"><span>Help Centre</span></button><hr><button class="signout" data-act="signout"><span>Sign out of CineSense</span></button>`;
  $('#gate').hidden=true; document.body.classList.remove('lock');
  render(); scrollTo({top:0});
  if(!state.notifs.length){
    [['New arrival: Starfall Protocol is now streaming',1],['Season 2 of Neon Requiem is here',12],['Because you liked Letters to Nobody: try Kaadhal Kadal',7],['Coming Oct 23: Orbit of Ashes',UPCOMING[0].id]]
      .reverse().forEach(([t,id])=>notify(t,id));
    state.notifs.forEach((n,k)=>n.time=['2 hours ago','Yesterday','2 days ago','3 days ago'][k]); renderBell();
  }
}

/* =================== MOOD AI =================== */
const ai=$('#ai'), log=$('#ai-log');
const AI_CHIPS=['😊 Feel-good','😢 Sad movies','😱 Something scary','💘 Romantic','🤯 Mind-bending','😂 Make me laugh','🚀 Uplifting sci-fi with strong female leads','🕵️ Thrillers like classic noir','🎬 Tamil feel-good films','😌 I am stressed'];
$('#aiChips').innerHTML=AI_CHIPS.map(c=>`<button class="chip" data-chip="${esc(c.replace(/^\S+\s/,''))}">${c}</button>`).join('');
$('#aiChips').addEventListener('click',e=>{ const c=e.target.closest('[data-chip]'); if(c) send(c.dataset.chip); });
$('#ai-fab').addEventListener('click',()=>openAI());
$('#aiClose').addEventListener('click',closeAI);
$('#aiForm').addEventListener('submit',e=>{ e.preventDefault(); const v=$('#aiInput').value.trim(); if(v){ $('#aiInput').value=''; send(v); } });
let greeted=false;
function openAI(text){
  hidePreview(); ai.hidden=false; $('#ai-fab').hidden=true;
  if(innerWidth<600) document.body.classList.add('lock');
  if(!greeted){ greeted=true; bot(`Hi${state.profile?' '+esc(state.profile.name):''}! I'm your Mood AI. Tell me how you feel or what kind of story you're in the mood for, and I'll find films that match the meaning, not just the keywords.`); }
  if(text) send(text); else setTimeout(()=>$('#aiInput').focus(),300);
}
function closeAI(){ ai.hidden=true; $('#ai-fab').hidden=false; if(modalWrap.hidden&&player.hidden) document.body.classList.remove('lock'); }
function addMsg(html,cls){ const d=document.createElement('div'); d.className='msg '+cls; d.innerHTML=html; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
function bot(text,extra=''){ return addMsg(`<p>${text}</p>${extra}`,'bot'); }
const LEADS = {
  feelgood:'Let\'s lift your mood. These are warm, light and easy to love.',
  sad:'Sometimes a good cry helps. These are tender and emotional, but worth it.',
  thrilling:'Buckle up. These will keep you on the edge of your seat.',
  romantic:'Something for the heart. Grab someone special or a big blanket.',
  scary:'Lights off, volume up. Watch these at your own risk.',
  mindbending:'These will keep you thinking long after the credits.',
  inspiring:'Stories about courage and people who refuse to give up.',
  funny:'Laughter incoming. These are pure fun.',
  chill:'Slow, calm and cozy. Perfect for unwinding.',
  dark:'Moody, gritty and full of shadows.',
  adventurous:'Big journeys and bigger stakes.',
  nostalgic:'A little trip back in time.'
};
function send(text){
  addMsg(`<p>${esc(text)}</p>`,'user');
  const typing=addMsg('<div class="typing"><i></i><i></i><i></i></div>','bot');
  setTimeout(()=>{
    typing.remove();
    const {q,results}=semanticSearch(text,10);
    const chips=understoodChips(q);
    if(!results.length){
      return bot(`I couldn't find a strong match for that. Try describing a feeling or a vibe, like "I want to laugh", "a sad movie for a rainy night" or "something like classic noir".`);
    }
    const first=[...q.moods][0];
    const facets = q.moods.size + q.genres.size + q.tags.size + q.langs.size;
    let lead;
    if(q.feelings.length) lead = `Sounds like you're feeling ${q.feelings.join(' and ')}. I picked titles that should help.`;
    else if(facets>1 && (q.genres.size||q.tags.size||q.langs.size)) lead = `Here are my top picks for "${esc(text)}", matched on meaning, themes and mood rather than exact keywords.`;
    else if(q.moods.has('sad')) lead = LEADS.sad;
    else lead = (first && LEADS[first]) || `Here's what matches "${esc(text)}" by theme and mood.`;
    const picks=results.slice(0,8).map(r=>`<button class="pick" data-open="${r.m.id}"><img src="${art(r.m,'poster')}" alt=""><b>${esc(r.m.title)}</b><small>${Math.min(99,Math.round(62+r.s*4))}% match</small></button>`).join('');
    bot(lead, `${chips.length?`<div class="why">I understood: ${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:''}<div class="picks">${picks}</div>
      <div class="why">Tap a poster for details · <button class="chip" data-act="ai-search" data-q="${esc(text)}">See all ${results.length} results</button></div>`);
  },650+Math.random()*500);
}
log.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="ai-search"]'); if(!b) return;
  e.stopPropagation(); closeAI(); q.value=b.dataset.q; search.classList.add('open','has'); state.query=b.dataset.q; render(); scrollTo({top:0});
},true);

/* =================== BOOT =================== */
renderBell();
Promise.race([Promise.all([document.fonts.load('40px "Bebas Neue"'),document.fonts.load('13px "DM Sans"')]),new Promise(r=>setTimeout(r,1500))])
  .catch(()=>{}).finally(()=>{ showGate(); setTimeout(()=>$('.profile')?.focus({preventScroll:true}),50); });
</script>
